# Based on original workflow from [template-package](https://github.com/vrchat-community/template-package)
# Modified by DeltaField on 2025-06-19

name: Build Release

on: 
  workflow_call:

jobs:

  # Validate Repository Configuration
  config:
    runs-on: ubuntu-latest
    outputs: 
      replaceFolder: ${{ steps.validate-variable.outputs.replaceFolder }}
    steps:
    - name: Validate Variable
      id: validate-variable
      run: |
        if [[ "${{ vars.PACKAGE_NAME }}" != "" ]]; then
          printf "%s\n" "PackageName: ${{ vars.PACKAGE_NAME }}"
        else
          printf "\e[31m%s\n\e[m" "PACKAGE_NAME not configured in the variable."
          exit 1
        fi
        if [[ "${{ vars.WORK_DIRECTORY }}" != "" ]]; then
          echo "replaceFolder=true" >> $GITHUB_OUTPUT
        else
          printf "%s\n" "WorkFolder: None!"
          echo "replaceFolder=false" >> $GITHUB_OUTPUT
        fi

    - name: Validate Reference Branch
      id: validate-reference-branch
      uses: GuillaumeFalourd/branch-exists@v1
      with:
        branch: '${{ vars.REF_BRANCH }}'

    - name: Branch Existence Result
      run: |
        if ${{steps.validate-reference-branch.outputs.exists == 'true'}}; then
          printf "%s\n" "RefBranch: ${{ vars.REF_BRANCH }}"
        else
          printf "\e[31m%s\n\e[m" "${{ vars.REF_BRANCH }} does not exist."
          exit 1
        fi

  # Build and release the Package
  # If the repository is not configured properly, this job will be skipped
  build:
    needs: config
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packagePath: .
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          ref: ${{ vars.REF_BRANCH }}

      # Get the Package version based on the package.json file
      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@b9f36ce6ee6fe2680cd3c32b2c62e22eade7e590
        with: 
            file_path: "${{ env.packagePath }}/package.json"
            prop_path: "version"

      - name: Check for Tag
        uses: mukunku/tag-exists-action@v1.6.0
        id: check-tag
        with:
          tag: ${{ steps.version.outputs.value }}

      - name: Tag Exception
        if: steps.check-tag.outputs.exists == 'true'
        run: |
          printf '%s\n' "Tag with the same version already exists."
          exit 1

      - name: Check for Work Directory
        if: needs.config.outputs.replaceFolder == 'true'
        run: |
          if [[ -d "${{ vars.WORK_DIRECTORY }}" ]]; then
            printf "%s\n" "WorkFolder: ${{ vars.WORK_DIRECTORY }}"
          else
            printf "\e[31m%s\n\e[m" "WORK_DIRECTORY not exists."
            exit 1
          fi

      - name: Get Id
        id: id
        uses: zoexx/github-action-json-file-properties@b9f36ce6ee6fe2680cd3c32b2c62e22eade7e590
        with:
          file_path: "${{ env.packagePath }}/package.json"
          prop_path: "name"

      - name: Clone & Replace
        if: needs.config.outputs.replaceFolder == 'true'
        run: |
          rsync -av ${{ vars.WORK_DIRECTORY }} ${{ vars.WORK_DIRECTORY }}/work/
          shopt -s dotglob
          tree -a
          find "${{ vars.WORK_DIRECTORY }}/work" -type f -print0 |
          while IFS= read -r -d '' file; do
            sed -i -e "s/\$name/${{ vars.PACKAGE_NAME }}/g" "$file"
            sed -i -e "s/\$version/${{ steps.version.outputs.value }}/g" "$file"
          done
          rsync -av ${{ vars.WORK_DIRECTORY }}/work/${{ vars.WORK_DIRECTORY }} .
          rm -rf ${{ vars.WORK_DIRECTORY }}/work/
          tree -a
          shopt -u dotglob

      - name: Check for changes
        id: check-for-changes
        run: git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & Push
        if: steps.check-for-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -n .
          git diff --name-only
          git commit -m "Release ${{ steps.version.outputs.value }}"
          git push

      - name: Recreate folder structure
        run: |
          mkdir -p Packages/${{ steps.id.outputs.value }}
          echo *
          shopt -s extglob
          rsync -av \
          --exclude=".*" \
          --exclude="Packages" \
          --exclude="raw/" \
          --exclude="raw.meta" \
          ./ ./Packages/${{ steps.id.outputs.value }}
          echo "packagePath=Packages/${{ steps.id.outputs.value }}" >> $GITHUB_ENV

      # Configure the Environment Variables needed for releasing the Package
      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}".zip >> $GITHUB_ENV
          echo "unityPackage=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}.unitypackage" >> $GITHUB_ENV

      # Zip the Package for release
      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" .

      # Build a list of .meta files for future use
      - name: Track Package Meta Files
        run: find "${{ env.packagePath }}/" -name \*.meta >> metaList

      # Make a UnityPackage version of the Package for release
      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList

      # Make a release tag of the version from the package.json file 
      - name: Create Tag
        id: tag_version
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: ${{ steps.version.outputs.value }}

      # Publish the Release to GitHub
      - name: Make Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.packagePath }}/package.json
          tag_name: ${{ steps.version.outputs.value }}
